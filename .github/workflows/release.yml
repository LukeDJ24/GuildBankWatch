name: Release

# Releases are driven by the addon's own version number: bump "## Version:"
# in GuildBankWatch.toc and push to main, and this builds the zip WowUp needs
# and publishes it. Pushes that leave the version alone are ignored, so
# ordinary commits cost nothing and never produce a spurious update prompt.
on:
  push:
    branches: [main]
    paths:
      - "**.lua"
      - "**.toc"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read addon metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^## Version:[[:space:]]*//p' GuildBankWatch.toc | tr -d '\r')
          # A .toc may list several interface versions ("120100, 120007");
          # release.json takes a single number, so use the first.
          interface=$(sed -n 's/^## Interface:[[:space:]]*//p' GuildBankWatch.toc |
            tr -d '\r' | cut -d, -f1 | tr -d '[:space:]')
          if [ -z "$version" ] || [ -z "$interface" ]; then
            echo "::error::Could not read '## Version:' / '## Interface:' from GuildBankWatch.toc"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "interface=$interface" >> "$GITHUB_OUTPUT"
          # WowUp reports the asset filename as the installed version, so the
          # filename has to change every release or clients see no update.
          echo "zip=GuildBankWatch-$version.zip" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::notice::Release v$version already exists. Bump '## Version:' in GuildBankWatch.toc to publish a new one."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Built with Python's stdlib rather than the zip/jq binaries: those are
      # not guaranteed on the runner image, and a silent failure there
      # produces an empty release rather than an obvious error.
      - name: Build package
        if: steps.meta.outputs.skip == 'false'
        env:
          ZIP: ${{ steps.meta.outputs.zip }}
          INTERFACE: ${{ steps.meta.outputs.interface }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, zipfile

          zip_name = os.environ["ZIP"]
          interface = int(os.environ["INTERFACE"])
          # WowUp installs whatever folders it finds at the zip root, and
          # requires the folder to be named after the repository.
          folder = "GuildBankWatch"
          files = ["GuildBankWatch.toc", "Core.lua", "UI.lua", "README.md"]

          with zipfile.ZipFile(zip_name, "w", zipfile.ZIP_DEFLATED) as z:
              for name in files:
                  z.write(name, "%s/%s" % (folder, name))

          # release.json is how WowUp prefers to learn the game flavour;
          # without it it falls back to guessing from the filename.
          meta = {"releases": [{"filename": zip_name, "nolib": False,
                  "metadata": [{"flavor": "mainline", "interface": interface}]}]}
          with open("release.json", "w") as handle:
              json.dump(meta, handle, indent=2)

          print("packaged %s" % zip_name)
          for name in sorted(zipfile.ZipFile(zip_name).namelist()):
              print("   ", name)
          PY
          # Fail loudly here rather than publishing an empty release.
          test -s "$ZIP" || { echo "::error::$ZIP was not created"; exit 1; }
          test -s release.json || { echo "::error::release.json was not created"; exit 1; }

      - name: Publish release
        if: steps.meta.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP: ${{ steps.meta.outputs.zip }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            --title "GuildBankWatch $VERSION" \
            --generate-notes \
            "$ZIP" release.json